name: Deploy personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy over verified SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x

          : "${DEPLOY_HOST:?请先配置 DEPLOY_HOST Secret}"
          : "${DEPLOY_PORT:?请先配置 DEPLOY_PORT Secret}"
          : "${DEPLOY_USER:?请先配置 DEPLOY_USER Secret}"
          : "${DEPLOY_SSH_KEY:?请先配置 DEPLOY_SSH_KEY Secret}"
          : "${DEPLOY_KNOWN_HOSTS:?请先配置 DEPLOY_KNOWN_HOSTS Secret}"

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]; then
            printf '部署失败：DEPLOY_PORT 必须是 1 到 65535 之间的端口号。\n' >&2
            exit 64
          fi
          port_number=$((10#$DEPLOY_PORT))
          if ((port_number < 1 || port_number > 65535)); then
            printf '部署失败：DEPLOY_PORT 超出有效范围。\n' >&2
            exit 64
          fi

          key_file="$RUNNER_TEMP/personal-website-deploy-key"
          known_hosts_file="$RUNNER_TEMP/personal-website-known-hosts"
          umask 077
          printf '%s' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          chmod 600 "$key_file" "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- /home/ubuntu/apps/personal-website" \
            < ops/deploy/deploy-remote.sh
